<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anmelden · Food Moment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F8F7F3">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <header class="login-header">
                <div class="login-brand" aria-label="Food Moment">Food Moment</div>
                <p class="login-eyebrow">Willkommen zurück</p>
                <h1 id="login-title">Anmelden</h1>
                <p class="login-intro">Öffne deinen Workspace und mach dort weiter, wo du aufgehört hast.</p>
            </header>

            <form id="login-form" class="login-form">
                <label for="login-email">
                    <span>E-Mail</span>
                    <input id="login-email" type="email" autocomplete="username" inputmode="email" required>
                </label>
                <label for="login-password">
                    <span>Passwort</span>
                    <input id="login-password" type="password" autocomplete="current-password" minlength="12" required>
                </label>
                <button id="login-submit" type="submit">Anmelden</button>
                <p id="login-message" class="login-message is-hidden" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="auth-shell.js"></script>
    <script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Moment Wallet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f5f7fb">
</head>
<body>
<div class="container">
    <header class="app-header"><button id="burger-button" class="burger-button" type="button" aria-label="Menü öffnen"></button><div class="app-header-title">Food Moment Platform</div><div id="burger-dropdown" class="burger-dropdown is-hidden"></div></header>

    <main class="page-content wallet-page">
        <section class="section-card wallet-intro">
            <div>
                <p class="recipe-kicker">Inspiration sammeln</p>
                <h1>Deine Food Moment Wallet</h1>
                <p>Speichere einen Link oder Gedanken. Erst wenn du ihn planst, wird daraus ein Food Moment.</p>
            </div>
            <form id="wallet-form" class="wallet-capture-form">
                <input id="wallet-title" type="text" placeholder="Titel – optional">
                <input id="wallet-url" type="url" placeholder="Link von Instagram, TikTok, Pinterest, Website …">
                <textarea id="wallet-note" rows="2" placeholder="Was gefällt dir daran? – optional"></textarea>
                <div class="form-actions"><button type="submit">Inspiration speichern</button></div>
            </form>
        </section>

        <section class="wallet-toolbar">
            <h2>Gespeichert</h2>
            <input id="wallet-search" class="recipe-search-input" type="search" placeholder="Wallet durchsuchen …">
        </section>
        <section id="wallet-list" class="wallet-grid"></section>
    </main>
</div>

<dialog id="wallet-plan-dialog" class="wallet-dialog">
    <form method="dialog" class="wallet-plan-form">
        <button class="wallet-dialog-close" value="cancel" aria-label="Schließen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <p class="recipe-kicker">Make it a Food Moment</p>
        <h2 id="wallet-plan-title">Zum Wochenplan hinzufügen</h2>
        <label>Wochenplan<select id="wallet-plan-select"></select></label>
        <div class="wallet-plan-row">
            <label>Tag<select id="wallet-day-select"></select></label>
            <label>Moment<select id="wallet-meal-select"></select></label>
        </div>
        <div class="form-actions"><button id="wallet-plan-confirm" type="button">Food Moment planen</button></div>
    </form>
</dialog>

<div id="app-toast" class="app-toast is-hidden"></div>
<script src="navigation.js"></script>
<script src="wallet.js"></script>
</body>
</html>

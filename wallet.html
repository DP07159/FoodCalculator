<!DOCTYPE html>
<html lang="de" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet · Food Moment Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F8F7F3">
</head>
<body class="module-page wallet-module">
    <header class="app-header platform-header">
        <button id="burger-button" class="burger-button" type="button" aria-label="Menü öffnen">
            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="app-header-title platform-wordmark" href="/index.html">Food Moment</a>
        <div id="burger-dropdown" class="burger-dropdown is-hidden"></div>
    </header>

    <div class="container module-container">
        <main class="page-content module-content">
            <header class="page-header module-page-header wallet-page-header">
                <p class="recipe-kicker">Inspiration</p>
                <h1>Wallet</h1>
                <p class="module-intro">Speichere Food-Ideen aus Social Media, Websites oder deinem Kopf. Erst später entscheidest du, was daraus wird.</p>
            </header>

            <section class="wallet-capture module-workspace" aria-labelledby="wallet-capture-title">
                <div class="module-toolbar wallet-capture-toolbar">
                    <div>
                        <h2 id="wallet-capture-title">Inspiration merken</h2>
                        <p class="module-toolbar-copy">Ein Link reicht. Titel und Notiz sind optional.</p>
                    </div>
                </div>
                <form id="wallet-capture-form" class="wallet-capture-form">
                    <div class="form-section wallet-url-field">
                        <label for="wallet-source-url">Link</label>
                        <input id="wallet-source-url" name="source_url" type="url" inputmode="url" autocomplete="url" placeholder="https://instagram.com/…">
                    </div>
                    <div class="form-section">
                        <label for="wallet-title">Titel <span class="field-optional">optional</span></label>
                        <input id="wallet-title" name="title" type="text" maxlength="240" placeholder="z. B. Zitronenpasta für Freitag">
                    </div>
                    <div class="form-section wallet-note-field">
                        <label for="wallet-note">Notiz <span class="field-optional">optional</span></label>
                        <textarea id="wallet-note" name="note" rows="2" maxlength="2000" placeholder="Was möchtest du dir dazu merken?"></textarea>
                    </div>
                    <div class="wallet-capture-actions">
                        <button class="primary-action-button" type="submit">
                            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z"/><path d="M7 7V5h10v2"/><path d="M8 11h8M8 15h5"/></svg>
                            <span>In Wallet speichern</span>
                        </button>
                    </div>
                    <p id="wallet-form-feedback" class="intent-feedback" aria-live="polite"></p>
                </form>
            </section>

            <section class="wallet-library" aria-labelledby="wallet-library-title">
                <div class="wallet-library-head">
                    <div>
                        <h2 id="wallet-library-title">Für später gemerkt</h2>
                        <p class="module-toolbar-copy">Dein Eingangskorb für Food-Inspiration.</p>
                    </div>
                    <label class="wallet-status-filter">
                        <span>Status</span>
                        <select id="wallet-status-select">
                            <option value="saved">Gemerkt</option>
                            <option value="used">Verwendet</option>
                            <option value="archived">Archiviert</option>
                            <option value="all">Alle</option>
                        </select>
                    </label>
                </div>
                <div id="wallet-list" class="wallet-list" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <div id="app-toast" class="app-toast is-hidden"></div>
    <script src="auth-shell.js"></script>
    <script src="navigation.js"></script>
    <script src="wallet.js"></script>
    <script>AuthShell.guard();</script>
</body>
</html>

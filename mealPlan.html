<!DOCTYPE html>
<html lang="de" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wochenplan · Food Moment Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F8F7F3">
</head>
<body class="module-page meal-plan-module">
    <header class="app-header platform-header">
        <button id="burger-button" class="burger-button" type="button" aria-label="Menü öffnen">
            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="app-header-title platform-wordmark" href="/index.html">Food Moment</a>
        <div id="burger-dropdown" class="burger-dropdown is-hidden"></div>
    </header>
    <div class="container module-container">
        <main class="page-content module-content">
            <header class="page-header module-page-header compact-module-header">
                <div><p class="recipe-kicker">Planung</p><h1>Wochenplan</h1><p class="module-intro">Plane deine Woche als eigenständiges Werkzeug – oder im Kontext deiner Food Moments.</p></div>
            </header>
            <section id="meal-plan" class="module-workspace meal-plan-workspace">
                <div class="meal-plan-topbar">
                    <div class="meal-plan-title-group">
                        <label class="control-label" for="plan-list">Plan auswählen</label>
                        <select id="plan-list" class="toolbar-plan-select"></select>
                        <div class="meal-plan-plan-meta">
                            <p id="current-plan-name" class="module-meta">Aktueller Wochenplan: keiner</p>
                            <span id="meal-plan-save-state" class="meal-plan-save-state">Noch nicht gespeichert</span>
                        </div>
                    </div>

                    <div class="meal-plan-current-actions">
                        <button type="button" class="toolbar-icon-button toolbar-shopping-button" onclick="shareWeeklyShoppingList()" title="Einkaufsliste teilen" aria-label="Einkaufsliste teilen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h15l-1.5 8.5H8L6 3H3"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg></button>
                        <button type="button" id="meal-plan-update-button" class="toolbar-icon-button toolbar-update-button" onclick="updateMealPlan()" title="Plan aktualisieren" aria-label="Plan aktualisieren"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/></svg></button>
                        <button type="button" id="meal-plan-workspaces-button" class="toolbar-icon-button" onclick="openMealPlanWorkspaces()" title="Workspaces zuordnen" aria-label="Workspaces zuordnen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><path d="M17.5 15v6M14.5 18h6"/></svg></button>
                        <button type="button" class="toolbar-icon-button toolbar-delete-button" onclick="deleteMealPlan()" title="Plan löschen" aria-label="Plan löschen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg></button>
                        <button type="button" class="primary-action-button toolbar-toggle-save-button" onclick="togglePlanSaveToolbar()"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Als neuen Plan speichern</span></button>
                        <details class="meal-plan-mobile-more">
                            <summary class="toolbar-icon-button" aria-label="Weitere Plan-Aktionen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></summary>
                            <div class="meal-plan-mobile-more-menu">
                                <button type="button" onclick="shareWeeklyShoppingList(); this.closest('details').removeAttribute('open')"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h15l-1.5 8.5H8L6 3H3"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span>Einkaufsliste teilen</span></button>
                                <button type="button" class="is-danger" onclick="deleteMealPlan(); this.closest('details').removeAttribute('open')"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 14h10l1-14"/><path d="M9 7V4h6v3"/></svg><span>Plan löschen</span></button>
                            </div>
                        </details>
                    </div>
                </div>

                <div id="plan-save-panel" class="plan-save-panel is-hidden">
                    <div class="meal-plan-save-inline">
                        <input type="text" id="plan-name" class="toolbar-plan-name" placeholder="Name für die neue Plan-Variante">
                        <button type="button" class="secondary-action-button plan-save-cancel" onclick="togglePlanSaveToolbar()">Abbrechen</button>
                        <button type="button" class="toolbar-icon-button toolbar-save-button" onclick="saveMealPlan()" title="Neuen Plan speichern" aria-label="Neuen Plan speichern"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12l2 2v14H5z"/><path d="M8 4v6h8V4"/><path d="M8 20v-6h8v6"/></svg></button>
                    </div>
                </div>

                <div class="weekly-plan-board" id="meal-table"></div>
                <div id="day-detail-panel" class="day-detail-panel"></div>
            </section>
        </main>
    </div>

    <div id="meal-plan-workspace-overlay" class="recipe-workspace-overlay is-hidden" aria-hidden="true"><div class="recipe-workspace-dialog" role="dialog" aria-modal="true" aria-labelledby="meal-plan-workspace-title"><div class="recipe-workspace-dialog-header"><div><p class="recipe-kicker">Wochenplan verfügbar machen</p><h2 id="meal-plan-workspace-title">Zu Workspaces hinzufügen</h2></div><button type="button" id="meal-plan-workspace-close" class="header-icon-button" aria-label="Schließen"><svg class="fc-icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="recipe-workspace-search-wrap"><svg class="fc-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" id="meal-plan-workspace-search" placeholder="Workspace suchen"></div><div id="meal-plan-workspace-list" class="recipe-workspace-list"></div><div class="recipe-workspace-dialog-footer"><span id="meal-plan-workspace-save-state" class="recipe-workspace-save-state"></span><button type="button" id="meal-plan-workspace-done" class="recipe-workspace-primary-button">Fertig</button></div></div></div>

<dialog id="meal-picker-dialog" class="meal-picker-dialog">
        <div class="meal-picker-shell">
            <div class="meal-picker-header">
                <div>
                    <p class="recipe-kicker">Wochenplan</p>
                    <h2>Etwas hinzufügen</h2>
                </div>
                <button type="button" class="meal-picker-close" onclick="closeMealPicker()" aria-label="Auswahl schließen">×</button>
            </div>
            <div class="meal-picker-type-switch" role="tablist" aria-label="Was möchtest du hinzufügen?">
                <button type="button" id="meal-picker-type-recipe" class="meal-picker-type-button is-active" role="tab" aria-selected="true" onclick="setMealPickerType('recipe')">
                    <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
                    <span><strong>Rezept</strong><small>Aus deinem Rezeptbuch</small></span>
                </button>
                <button type="button" id="meal-picker-type-wallet" class="meal-picker-type-button" role="tab" aria-selected="false" onclick="setMealPickerType('wallet')">
                    <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14v12H5z"/><path d="M8 7V5h8v2"/><path d="M8 11h8"/></svg>
                    <span><strong>Food Moment / Inspiration</strong><small>Aus deiner Wallet</small></span>
                </button>
            </div>
            <div class="meal-picker-search-wrap">
                <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="search" id="meal-picker-search" placeholder="Rezepte durchsuchen …" autocomplete="off">
            </div>
            <div id="meal-picker-results" class="meal-picker-results"></div>
        </div>
    </dialog>
    <div id="app-toast" class="app-toast is-hidden"></div>
    <script src="auth-shell.js"></script>
    <script src="navigation.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Food Moment · Food Moment Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F8F7F3">
</head>
<body class="food-moment-home">
    <header class="app-header platform-header">
        <button id="burger-button" class="burger-button" type="button" aria-label="Menü öffnen">
            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="app-header-title platform-wordmark" href="/index.html">Food Moment</a>
        <div id="burger-dropdown" class="burger-dropdown is-hidden"></div>
    </header>

    <div class="container home-container">
        <main class="food-moment-start" aria-labelledby="food-moment-title">
            <section class="food-moment-hero">
                <h1 id="food-moment-title">Dein Food Moment.</h1>
                <div id="food-moment-source-context" class="food-moment-source-context" hidden></div>
                <div id="food-moment-primary-actions" class="food-moment-primary-actions" aria-label="Food-Moment-Einstiege"></div>
                <div id="food-moment-secondary-actions" class="food-moment-secondary-actions" aria-label="Direkte Einstiege"></div>
            </section>

            <section id="home-upcoming-section" class="home-upcoming-section" aria-labelledby="home-upcoming-title" hidden>
                <div class="home-section-heading home-upcoming-heading">
                    <div><p class="home-section-kicker">Als Nächstes</p><h2 id="home-upcoming-title">Deine Food Moments</h2></div>
                    <a href="/foodMoments.html">Alle Food Moments →</a>
                </div>
                <div id="home-upcoming-list" class="home-upcoming-list"></div>
            </section>

            <section id="food-world-section" class="food-world-section" aria-labelledby="food-world-title">
                <div class="home-section-heading">
                    <p class="home-section-kicker">Direkt zu</p>
                    <h2 id="food-world-title">Deine Food-Welt</h2>
                </div>
                <nav id="food-world-links" class="food-world-links" aria-label="Module"></nav>
            </section>
        </main>
    </div>

    <dialog id="capture-choice-dialog" class="home-choice-dialog">
        <div class="home-choice-dialog-inner">
            <div class="home-choice-dialog-header">
                <div>
                    <p class="home-section-kicker">Etwas Neues</p>
                    <h2>Was möchtest du festhalten?</h2>
                </div>
                <button id="capture-choice-close" class="home-dialog-close" type="button" aria-label="Schließen">
                    <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <div id="capture-choice-options" class="capture-choice-options"></div>
        </div>
    </dialog>

    <script src="auth-shell.js"></script>
    <script src="navigation.js"></script>
    <script src="home.js"></script>
    <script>AuthShell.guard();</script>
</body>
</html>

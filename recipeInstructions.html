<!DOCTYPE html>
<html lang="de" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kochanleitung</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#F8F7F3">
</head>
<body class="module-page recipe-reading-module">
    <header class="app-header">
        <button id="burger-button" class="burger-button" type="button" aria-label="Menü öffnen">
            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <a class="app-header-title platform-wordmark" href="/index.html">Food Moment</a>

        <div id="burger-dropdown" class="burger-dropdown is-hidden"></div>
    </header>

    <div class="container module-container">
        <main class="page-content recipe-instructions-page">
            <header class="header-container recipe-hero">
                <div class="recipe-info">
                    <p class="recipe-kicker">Rezept</p>
                    <h1 id="display-recipe-name"></h1>
                </div>
                <div class="recipe-header-actions">
                    <div class="recipe-stat recipe-portions-control" title="Portionen anpassen">
                        <button type="button" id="decrease-portions-button" class="recipe-portion-button" aria-label="Portionen reduzieren">
                            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
                        </button>
                        <span class="recipe-stat-icon"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="12" r="6"/><circle cx="11" cy="12" r="3"/><path d="M20 4v16"/></svg></span>
                        <span id="display-recipe-portions"></span>
                        <button type="button" id="increase-portions-button" class="recipe-portion-button" aria-label="Portionen erhöhen">
                            <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                    </div>
                    <div class="recipe-stat"><span class="recipe-stat-icon"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-6.8 0-2.6-1.5-5.1-4.4-7.5.1 2.1-.7 3.5-2.1 4.2.2-3.3-1.3-6-4.1-8.1.2 3.6-3.4 5.6-3.4 11.2C5 19.3 8 22 12 22z"/></svg></span><span id="display-recipe-calories"></span></div>
                    <button type="button" id="favorite-recipe-button" class="header-icon-button favorite-header-button" title="Als Favorit markieren" aria-label="Als Favorit markieren"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
                    <button type="button" id="workspace-assignments-button" class="header-icon-button is-hidden" title="Workspaces zuordnen" aria-label="Workspaces zuordnen">
                        <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="4" width="7" height="7" rx="1.5"/>
                            <rect x="14" y="4" width="7" height="7" rx="1.5"/>
                            <rect x="3" y="15" width="7" height="6" rx="1.5"/>
                            <path d="M17.5 15v6M14.5 18h6"/>
                        </svg>
                    </button>
                    <button type="button" id="share-ingredients-button" class="header-icon-button" title="Zutatenliste teilen" aria-label="Zutatenliste teilen"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/></svg></button>
                    <button type="button" id="recipe-food-moments-button" class="header-icon-button" title="Food Moments verwalten" aria-label="Food Moments verwalten"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span id="recipe-food-moments-badge" class="recipe-context-badge"></span></button>
                    <button type="button" id="recipe-shopping-button" class="header-icon-button" title="Zutaten zur Einkaufsliste" aria-label="Zutaten zur Einkaufsliste"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="10" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg></button>
                    <button type="button" id="edit-recipe-button" class="primary-action-button recipe-edit-primary"><svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Rezept bearbeiten</span></button>
                </div>
            </header>

            <section id="recipe-inspiration-section" class="recipe-inspiration-section is-hidden" aria-labelledby="recipe-inspiration-title">
                <div class="recipe-inspiration-heading">
                    <div><p class="recipe-kicker">Inspiration</p><h2 id="recipe-inspiration-title">Quelle & Idee</h2></div>
                    <span id="recipe-inspiration-count" class="recipe-inspiration-count"></span>
                </div>
                <div id="recipe-inspiration-list" class="recipe-inspiration-list"></div>
            </section>

            <section class="content-section ingredients-content-section">
                <h2>Zutaten</h2>
                <ul id="display-recipe-ingredients"></ul>
            </section>

            <section class="content-section instructions-content-section">
                <h2>Anleitung</h2>
                <div id="display-recipe-instructions"></div>
            </section>
        </main>
    </div>


    <div id="recipe-workspace-overlay" class="recipe-workspace-overlay is-hidden" aria-hidden="true">
        <div class="recipe-workspace-dialog" role="dialog" aria-modal="true" aria-labelledby="recipe-workspace-title">
            <div class="recipe-workspace-dialog-header">
                <div>
                    <p class="recipe-kicker">Rezept verfügbar machen</p>
                    <h2 id="recipe-workspace-title">Zu Workspaces hinzufügen</h2>
                </div>
                <button type="button" id="recipe-workspace-close" class="header-icon-button" aria-label="Schließen">
                    <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="recipe-workspace-search-wrap">
                <svg class="fc-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                <input type="search" id="recipe-workspace-search" placeholder="Workspace suchen">
            </div>

            <div id="recipe-workspace-list" class="recipe-workspace-list"></div>

            <div class="recipe-workspace-dialog-footer">
                <span id="recipe-workspace-save-state" class="recipe-workspace-save-state"></span>
                <button type="button" id="recipe-workspace-done" class="recipe-workspace-primary-button">Fertig</button>
            </div>
        </div>
    </div>


    <dialog id="recipe-food-moments-dialog" class="recipe-context-dialog">
        <div class="recipe-context-dialog-shell">
            <header><div><p class="recipe-kicker">Food Moments</p><h2>Verknüpfte Momente</h2></div><button type="button" id="recipe-food-moments-close" class="header-icon-button" aria-label="Schließen"><svg class="fc-icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
            <p class="recipe-context-copy">Verknüpfe dieses Rezept mit bestehenden Food Moments oder erstelle direkt einen neuen.</p>
            <div class="recipe-context-actions"><button type="button" id="recipe-food-moment-create" class="primary-action-button"><svg class="fc-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Neuen Food Moment erstellen</span></button></div>
            <div class="recipe-context-search"><input id="recipe-food-moments-search" type="search" placeholder="Food Moments suchen …"></div>
            <div id="recipe-food-moments-list" class="recipe-context-list"></div>
            <footer><span id="recipe-food-moments-state" class="recipe-workspace-save-state"></span><button type="button" id="recipe-food-moments-done" class="primary-action-button">Fertig</button></footer>
        </div>
    </dialog>
    <div id="app-toast" class="app-toast is-hidden"></div>
    <script src="auth-shell.js"></script>
    <script>AuthShell.guard();</script>
    <script src="navigation.js"></script>
    <script src="recipeInstructions.js"></script>
</body>
</html>
